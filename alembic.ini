# Alembic configuration for the users database (Phase 13). sqlalchemy.url is
# deliberately left blank here -- alembic/env.py reads the real value from
# DATABASE_URL at runtime (same variable backend/db/session.py uses), so this file
# never needs a real connection string and stays safe to commit.
#
# Usage (see README "Database Architecture" for the full walkthrough):
#   uv run alembic upgrade head          # apply all migrations
#   uv run alembic revision -m "..."     # hand-write a new migration
#   uv run alembic downgrade -1          # roll back one migration

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
