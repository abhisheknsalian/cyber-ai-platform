# Phase 6.3: wires the Phase 6.1 backend image and the Phase 6.2 frontend image
# together. Ollama is intentionally NOT a service here -- it keeps running on the
# host exactly as in every prior phase (see README "Docker Backend" /
# "Docker Compose" sections for why: it is a large, GPU-capable, host-installed
# service that both this stack and non-Dockerized local dev share unchanged).
#
# Networking model (see README "Docker Compose" > "Networking" for the full
# rationale): the browser talks to the backend DIRECTLY on its published port, not
# through the frontend's nginx. This reuses the existing Phase 5.2 cross-origin
# cookie + CSRF architecture completely unchanged -- no proxy was added "merely for
# convenience." The `cyber-ai-net` network below is still declared explicitly for
# service isolation and DNS between the two containers, even though the browser's own
# requests to the backend do not traverse it.
#
# All backend secrets/config come from environment variables substituted from a root
# .env file (never committed -- see .env.example for the placeholder template).
#
# Phase 13 adds the `db` service below: a dedicated PostgreSQL instance for this
# project's persistent user accounts (backend/db/, alembic/). Deliberately its own
# service/container/named volume/network-scoped hostname -- it never publishes a host
# port, so it cannot collide with an unrelated Postgres container (e.g. a
# "sqlgpt-postgres" for a different project) that might already be running on this
# machine. See README "Database Architecture".

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyber_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-cyber_ai}
    volumes:
      - cyber_ai_postgres_data:/var/lib/postgresql/data
    networks:
      - cyber-ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber_ai} -d ${POSTGRES_DB:-cyber_ai}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyber-ai-backend
    # Restarts automatically after a crash or host reboot, but stays stopped if a
    # human explicitly stops it (`docker compose stop`/`down`) -- "always" would
    # fight that; "no" (the default) leaves a crashed container down indefinitely.
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CYBER_AI_API_KEY: ${CYBER_AI_API_KEY:?Set CYBER_AI_API_KEY in .env (see .env.example)}
      CYBER_AI_USERNAME: ${CYBER_AI_USERNAME:?Set CYBER_AI_USERNAME in .env (see .env.example)}
      CYBER_AI_PASSWORD: ${CYBER_AI_PASSWORD:?Set CYBER_AI_PASSWORD in .env (see .env.example)}
      # Points at the dedicated `db` service above by default -- only the Compose
      # network-internal hostname/port, never a host-published one. Override to point
      # at a different database entirely (e.g. local SQLite) without a code change.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-cyber_ai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyber_ai}}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # Includes both the Vite dev-server origin (so a non-Dockerized frontend can
      # still reach a Dockerized backend during development) and the default
      # published nginx origin below. Override in .env if either port is changed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      # Read-only: the backend only ever calls joblib.load() on this artifact.
      - ./models:/app/models:ro
      # NOT read-only -- Chroma's SQLite backend needs write access (WAL/journal
      # files) even for read-only queries. Discovered and documented in Phase 6.1;
      # mounting this :ro breaks every /analyze request with "attempt to write a
      # readonly database".
      - ./rag/chroma_db:/app/rag/chroma_db
    extra_hosts:
      # Docker Desktop (macOS/Windows) provides host.docker.internal automatically;
      # this makes the same OLLAMA_HOST default also work on Linux.
      - "host.docker.internal:host-gateway"
    networks:
      - cyber-ai-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cyber-ai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Must be reachable from the BROWSER (running on the host), not from inside the
      # frontend container -- so this is the backend's host-published port
      # (http://localhost:8000), never the Compose service name (http://backend:8000,
      # which only resolves on the Docker network between containers).
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    networks:
      - cyber-ai-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  cyber-ai-net:
    driver: bridge

volumes:
  # Persists Postgres's data directory across container restarts/recreations. Named
  # (not bind-mounted) so it's managed entirely by Docker and namespaced to this
  # Compose project -- `docker volume ls` shows it as
  # <project>_cyber_ai_postgres_data, distinct from any unrelated project's volumes.
  cyber_ai_postgres_data:
