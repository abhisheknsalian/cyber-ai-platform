# Static-only SPA server. Deliberately does NOT proxy API requests to the backend --
# the browser talks to the backend directly (see docker-compose.yml and the README
# "Docker Compose" / "Networking" sections for why: it reuses the existing Phase 5.2
# cross-origin cookie + CSRF architecture unchanged, instead of adding a proxy layer
# purely for convenience).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 8: baseline defensive headers on every response. Deliberately no
    # Content-Security-Policy here -- the backend URL this SPA talks to is only known
    # at container *startup* (see docker-entrypoint.sh/config.js), not at the time
    # this file is written, so a static `connect-src` would either have to be
    # wildcarded (defeating the point) or risk breaking the app against whatever
    # backend URL Compose actually injects. add_header in an nginx `server` block is
    # inherited by every `location` below, so this applies everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # config.js is generated per-container-start by docker-entrypoint.sh into
    # /run/frontend-config/ (a writable path outside the otherwise-static html root --
    # see docker-entrypoint.sh's own comment) and must never be cached by the browser,
    # or a new backend URL won't take effect until a hard refresh.
    location = /config.js {
        alias /run/frontend-config/config.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing (react-router-dom): any path that isn't a real static file
    # falls back to index.html so direct navigation/refresh on e.g. /analyze works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
